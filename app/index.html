<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice City — GTA 6 Cover Art</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0b0b12;
    color: #f2f2f2;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
  }
  figure { max-width: 1024px; width: 100%; }
  img {
    display: block;
    width: 100%;
    height: auto;
    border: 1px solid #2a2a38;
  }
  figcaption { text-align: center; margin-top: 18px; }
  h1 { font-size: 28px; letter-spacing: 0.04em; }
  p { margin-top: 8px; font-size: 15px; color: #b9b9c7; line-height: 1.5; }
</style>
</head>
<body>
<figure>
  <img src="./cover.jpg" alt="Grand Theft Auto VI — Vice City multi-panel cover art" width="1024" height="1024">
  <figcaption>
    <h1>Grand Theft Auto VI &middot; Vice City</h1>
    <p>Fan-made cover art. A Gemini-generated multi-panel Vice City cover: a getaway
    driver in a pink suit, a helicopter spotlight, a speedboat chase and a neon
    nightclub under a Vice City sunset. Not affiliated with Rockstar Games.</p>
  </figcaption>
</figure>
</body>
</html>
